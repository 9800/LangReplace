name: Build

on:
  push:
    branches: [ main, master ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach files to (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Build LangReplace
        run: zig build -Doptimize=ReleaseSmall

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Build Installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\LangReplace.iss"'

      - name: Verify build outputs
        shell: pwsh
        run: |
          if (-not (Test-Path "zig-out/bin/LangReplace.exe")) { Write-Error "LangReplace.exe not found!"; exit 1 }
          if (-not (Test-Path "installer/Output/LangReplace-Setup.exe")) { Write-Error "Setup not found!"; exit 1 }
          Write-Host "OK: both files built"

      - name: Prepare release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "release" -Force | Out-Null
          Copy-Item "zig-out/bin/LangReplace.exe" "release/LangReplace-Portable.exe"
          Copy-Item "installer/Output/LangReplace-Setup.exe" "release/LangReplace-Setup.exe"

      # 📥 Artifact برای push معمولی
      - name: Upload Artifacts
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: LangReplace-Build
          path: release/

      # 🚀 پیوست خودکار وقتی ریلیز publish میشه
      - name: Attach to Release (auto)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/LangReplace-Portable.exe
            release/LangReplace-Setup.exe
          fail_on_unmatched_files: true

      # 🚀 پیوست دستی به هر تگی که بخوای
      - name: Attach to Release (manual)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: |
            release/LangReplace-Portable.exe
            release/LangReplace-Setup.exe
          fail_on_unmatched_files: true
