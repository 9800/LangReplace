name: Build LangReplace

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0
      
      - name: Build
        run: zig build -Doptimize=ReleaseSmall
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: langreplace-windows
          path: zig-out/bin/LangReplace.exe
